<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthConnect | Leaderboard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="logo"><i class="fa-solid fa-heart-pulse"></i> HealthConnect</div>
    <ul class="nav-links">
      <a href="/index.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="/meals.html" class="nav-item"><i class="fa-solid fa-utensils"></i> Meals</a>
      <a href="/workouts.html" class="nav-item"><i class="fa-solid fa-dumbbell"></i> Workouts</a>
      <a href="/feed.html" class="nav-item"><i class="fa-solid fa-users"></i> Social Feed</a>
      <a href="/leaderboard.html" class="nav-item active"><i class="fa-solid fa-trophy"></i> Leaderboard</a>
    </ul>
    <button class="logout-btn" onclick="triggerLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </nav>

  <main class="main-content">
    <div class="container" style="max-width: 800px;">
      <header class="top-header">
        <div>
          <h1 class="page-title"><i class="fa-solid fa-trophy" style="color: #fbbf24; margin-right: 10px;"></i>Leaderboard</h1>
          <p class="page-subtitle"><i class="fa-solid fa-fire-flame-curved" style="margin-right: 5px;"></i>Top fitness champions by calories burned</p>
        </div>
      </header>

      <div class="card">
        <div id="leaderboardList" style="display: flex; flex-direction: column; gap: 1rem;">
           <!-- Dynamic -->
        </div>
      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/leaderboard.js"></script>
</body>
</html>
