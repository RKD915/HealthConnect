<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthConnect | Social Feed</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .post-card { display: flex; flex-direction: column; gap: 1rem; border-radius: 16px; margin-bottom: 2rem; }
    .post-header { display: flex; align-items: center; justify-content: space-between; }
    .post-author { display: flex; align-items: center; gap: 1rem; }
    .post-avatar { width: 40px; height: 40px; background-color: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .post-actions { display: flex; gap: 1rem; border-top: 1px solid #e5e7eb; padding-top: 1rem; margin-top: 1rem; }
    .post-action-btn { background: none; border: none; color: var(--text-light); cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-family: inherit; font-size: 0.9rem; transition: var(--transition); }
    .post-action-btn:hover, .post-action-btn.liked { color: var(--primary); }
    .comments-section { display: none; margin-top: 1rem; background-color: #f9fafb; padding: 1rem; border-radius: 8px; }
    .comment { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="logo"><i class="fa-solid fa-heart-pulse"></i> HealthConnect</div>
    <ul class="nav-links">
      <a href="/index.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="/meals.html" class="nav-item"><i class="fa-solid fa-utensils"></i> Meals</a>
      <a href="/workouts.html" class="nav-item"><i class="fa-solid fa-dumbbell"></i> Workouts</a>
      <a href="/feed.html" class="nav-item active"><i class="fa-solid fa-users"></i> Social Feed</a>
      <a href="/leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i> Leaderboard</a>
    </ul>
    <button class="logout-btn" onclick="triggerLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </nav>

  <main class="main-content">
    <div class="container" style="max-width: 800px;">
      <header class="top-header">
        <div>
          <h1 class="page-title"><i class="fa-solid fa-users" style="color: var(--primary); margin-right: 10px;"></i>Social Feed</h1>
          <p class="page-subtitle"><i class="fa-regular fa-comments" style="margin-right: 5px;"></i>See what your network is up to</p>
        </div>
      </header>

      <!-- Create Post -->
      <div class="card" style="margin-bottom: 2rem;">
        <form id="createPostForm" style="display: flex; gap: 1rem;">
          <input type="text" id="postContent" class="form-control" placeholder="Share your fitness milestone..." required style="flex: 1;">
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Post</button>
        </form>
      </div>

      <!-- Feed Container -->
      <div id="feedContainer">
        <!-- Posts will dynamically go here -->
      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/feed.js"></script>
</body>
</html>
