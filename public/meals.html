<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthConnect | Meals</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="logo"><i class="fa-solid fa-heart-pulse"></i> HealthConnect</div>
    <ul class="nav-links">
      <a href="/index.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="/meals.html" class="nav-item active"><i class="fa-solid fa-utensils"></i> Meals</a>
      <a href="/workouts.html" class="nav-item"><i class="fa-solid fa-dumbbell"></i> Workouts</a>
      <a href="/feed.html" class="nav-item"><i class="fa-solid fa-users"></i> Social Feed</a>
      <a href="/leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i> Leaderboard</a>
    </ul>
    <button class="logout-btn" onclick="triggerLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </nav>

  <main class="main-content">
    <div class="container">
      <header class="top-header">
        <div>
          <h1 class="page-title"><i class="fa-solid fa-utensils" style="color: var(--primary); margin-right: 10px;"></i>Meals</h1>
          <p class="page-subtitle"><i class="fa-solid fa-apple-whole" style="margin-right: 5px;"></i>Track your nutrition</p>
        </div>
      </header>

      <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
        
        <!-- Add Meal Form -->
        <div class="card" style="align-self: start;">
          <h3 class="card-title"><i class="fa-solid fa-plus-circle" style="color: var(--accent); margin-right: 8px;"></i>Add Meal</h3>
          <form id="addMealForm">
            <div class="form-group">
              <label>Meal Name</label>
              <input type="text" id="mealName" class="form-control" required placeholder="e.g. Oatmeal">
            </div>
            <div class="form-group">
              <label>Calories</label>
              <input type="number" id="mealCalories" class="form-control" required placeholder="e.g. 350">
            </div>
            <div class="form-group">
              <label>Type</label>
              <select id="mealType" class="form-control">
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Snack">Snack</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-check"></i> Add Meal</button>
          </form>
        </div>

        <!-- Meal history -->
        <div class="card">
          <h3 class="card-title"><i class="fa-solid fa-clock-rotate-left" style="color: var(--primary); margin-right: 8px;"></i>Recent Meals</h3>
          <div id="mealsList" style="display: flex; flex-direction: column; gap: 1rem;">
             <!-- Populated dynamically -->
          </div>
        </div>

      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/meals.js"></script>
</body>
</html>
