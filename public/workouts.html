<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthConnect | Workouts</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="logo"><i class="fa-solid fa-heart-pulse"></i> HealthConnect</div>
    <ul class="nav-links">
      <a href="/index.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="/meals.html" class="nav-item"><i class="fa-solid fa-utensils"></i> Meals</a>
      <a href="/workouts.html" class="nav-item active"><i class="fa-solid fa-dumbbell"></i> Workouts</a>
      <a href="/feed.html" class="nav-item"><i class="fa-solid fa-users"></i> Social Feed</a>
      <a href="/leaderboard.html" class="nav-item"><i class="fa-solid fa-trophy"></i> Leaderboard</a>
    </ul>
    <button class="logout-btn" onclick="triggerLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </nav>

  <main class="main-content">
    <div class="container">
      <header class="top-header">
        <div>
          <h1 class="page-title"><i class="fa-solid fa-dumbbell" style="color: var(--accent); margin-right: 10px;"></i>Workouts</h1>
          <p class="page-subtitle"><i class="fa-solid fa-person-running" style="margin-right: 5px;"></i>Log your activities</p>
        </div>
      </header>

      <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
        
        <!-- Add Workout Form -->
        <div class="card" style="align-self: start;">
          <h3 class="card-title"><i class="fa-solid fa-plus-circle" style="color: var(--primary); margin-right: 8px;"></i>Add Workout</h3>
          <form id="addWorkoutForm">
            <div class="form-group">
              <label>Exercise Type</label>
              <select id="workoutType" class="form-control" required>
                <option value="" disabled selected>Select Activity</option>
                <option value="Running">Running</option>
                <option value="Cycling">Cycling</option>
                <option value="Gym">Gym/Weightlifting</option>
                <option value="Swimming">Swimming</option>
                <option value="Yoga">Yoga</option>
                <option value="HIIT">HIIT</option>
                <option value="Walking">Walking</option>
              </select>
            </div>
            <div class="form-group">
              <label>Duration (mins)</label>
              <input type="number" id="workoutDuration" class="form-control" required placeholder="e.g. 45">
            </div>
            <div class="form-group">
              <label>Calories Burned</label>
              <input type="number" id="workoutCalories" class="form-control" required placeholder="e.g. 300">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-check"></i> Log Activity</button>
          </form>
        </div>

        <!-- Workout history -->
        <div class="card">
          <h3 class="card-title"><i class="fa-solid fa-clock-rotate-left" style="color: var(--accent); margin-right: 8px;"></i>Recent Activity</h3>
          <div id="workoutsList" style="display: flex; flex-direction: column; gap: 1rem;">
             <!-- Populated dynamically -->
          </div>
        </div>

      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/workouts.js"></script>
</body>
</html>
