<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthConnect | Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--secondary); margin: 0; }
    .auth-container { max-width: 400px; width: 100%; padding: 2rem; }
    .auth-card { padding: 3rem 2rem; text-align: center; }
    .auth-logo { font-family: 'Poppins', sans-serif; font-size: 2rem; color: var(--primary); margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .auth-switch { margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-light); }
    .auth-switch a { cursor: pointer; font-weight: 500; }
    .hidden { display: none; }
    #authError { color: var(--primary); margin-bottom: 1rem; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="card auth-card">
    <div class="auth-logo"><i class="fa-solid fa-heart-pulse"></i> HealthConnect</div>
    
    <div id="authError"></div>

    <!-- Login Form -->
    <form id="loginForm">
      <h2 style="margin-bottom: 1.5rem;">Welcome Back</h2>
      <div class="form-group" style="text-align: left;">
        <label>Email</label>
        <input type="email" id="loginEmail" class="form-control" required placeholder="user@example.com">
      </div>
      <div class="form-group" style="text-align: left;">
        <label>Password</label>
        <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-arrow-right-to-bracket"></i> Login</button>
      <div class="auth-switch">Don't have an account? <a id="showRegister">Register here</a></div>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden">
      <h2 style="margin-bottom: 1.5rem;">Create Account</h2>
      <div class="form-group" style="text-align: left;">
        <label>Name</label>
        <input type="text" id="regName" class="form-control" required>
      </div>
      <div class="form-group" style="text-align: left;">
        <label>Email</label>
        <input type="email" id="regEmail" class="form-control" required>
      </div>
      <div class="form-group" style="text-align: left;">
        <label>Password</label>
        <input type="password" id="regPassword" class="form-control" required>
      </div>
      <!-- Optional inputs hidden for simplicity in demo, backend handles missing args reasonably -->
      <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-user-plus"></i> Register</button>
      <div class="auth-switch">Already have an account? <a id="showLogin">Login here</a></div>
    </form>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
